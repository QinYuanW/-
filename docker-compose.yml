# ============================================================
# 物联网 PaaS 云平台 · MVP 基础设施编排
# EMQX + Redis + MySQL 8.0 + Prometheus/Grafana/Alertmanager + Kafka
# 用法：docker compose up -d
#   建库建表 + 演示数据 + admin 账号全部自动完成，无需再手工跑 SQL。
#
# F5（2026-10-12）：MySQL 入栈。原先刻意"不进容器"（避 3306 冲突），代价是：
#   ① 本机 MySQL57(Windows 服务) 多次意外停止（BUG-22），恢复要管理员提权 net start；
#   ② 换机器就得重装重配，环境无法一键拉起。
#   ⚠️ 入栈后 3306 归容器，**本机 MySQL57 服务必须停用并置为禁用**（否则端口冲突起不来）。
#   见 docs/06_运维监控/端口与访问清单.md
# ============================================================

services:
  # 业务库：MySQL 8.0（DDL 与 5.7 双兼容，见 db/schema.sql 头部）
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      # root 口令沿用本机 5.7 时代的值，旧脚本/旧习惯无痛切换（仅本地开发）
      - MYSQL_ROOT_PASSWORD=123456
      - TZ=Asia/Shanghai
    command:
      # 服务端默认字符集对齐 db/schema.sql：8.0 默认是 utf8mb4_0900_ai_ci，
      # 与既有库的 utf8mb4_unicode_ci 不一致，跨表/跨库比较会报 "Illegal mix of collations"。
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 时区对齐后端 JDBC 的 serverTimezone=Asia/Shanghai：
      # 否则 CURRENT_TIMESTAMP(3) 落的是 UTC，所有时间戳整体偏 8 小时。
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
      # 初始化脚本：仅在**数据卷为空**（首次建库）时，按文件名顺序各执行一次。
      # 顺序不可乱：schema 建库建表 → init-user 建账号授权 → seed 演示数据 → init-admin 管理员。
      # ⚠️ 建过库之后再改这些脚本**不会重跑**；要重建基线：docker compose down -v 再 up。
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/init-user.sql:/docker-entrypoint-initdb.d/02-init-user.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/03-seed.sql:ro
      - ./db/init-admin.sql:/docker-entrypoint-initdb.d/04-admin.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  emqx:
    image: emqx/emqx:5.8
    container_name: emqx
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT
      - "8883:8883"   # MQTT over TLS
      - "18083:18083" # Dashboard（浏览器访问 localhost:18083）
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
      # F2：MQTT over TLS(8883) 的自签证书。listener ssl:default 指向 ${EMQX_ETC_DIR}/certs，
      # 用宿主目录覆盖之——证书随仓库版本化，「换证书 = 替换文件 + 重启」，不依赖 docker cp
      # （docker cp 在容器重建后会丢，TLS 会静默退回 EMQX 自带的 CN=Server 无 SAN 证书）。
      - ./certs:/opt/emqx/etc/certs:ro
    environment:
      # Dashboard 初始账号，首次启动生效（登录后请改密码）
      - EMQX_DASHBOARD__DEFAULT_USERNAME=admin
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=public

  redis:
    image: redis:7.2
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.53.2
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - emqx

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      # ⚠️ 必须挂 /var/lib/grafana：否则容器被 recreate（docker compose up 触发重建）后，
      # Grafana 的 sqlite（grafana.db：改过的密码 / 手建大盘 / 告警静默）全部归零、
      # 静默退回 admin/admin。而 provisioning 与 dashboards 是 ro 挂载、每次重灌，
      # 大盘照样打得开 —— 极易误判成"数据没丢"。
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on:
      - prometheus

  # D1：单节点 Kafka（KRaft，无 ZooKeeper）
  # 双 listener：INTERNAL(kafka:29092) 供同栈 EMQX bridge；EXTERNAL(localhost:9092) 供宿主机 Java 消费者
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # 官方(apache/kafka 镜像) KRaft 双通信 listener 写法：
      # DOCKER(kafka:29092) 供同栈 EMQX bridge；HOST(localhost:9092) 供宿主机 Java 消费者；CONTROLLER 内部选主
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9091
      KAFKA_LISTENERS: CONTROLLER://localhost:9091,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data

volumes:
  mysql_data:
  emqx_data:
  emqx_log:
  redis_data:
  kafka_data:
  grafana_data:
