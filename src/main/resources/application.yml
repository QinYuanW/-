server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: iot-platform

  # 数据源：本地 MySQL 5.7（专用账号 iot）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/iot_platform?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: iot
    password: 123456
    hikari:
      # 修复 Hikari connection broken WARN：自动验证连接有效性，maxLifetime 短于 MySQL 自动断开时间
      max-lifetime: 180000  # 3 分钟
      connection-timeout: 30000

  # Redis：设备在线状态 / 鉴权凭据缓存
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，上线前移除
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 逻辑删除：与 schema.sql 的 deleted 字段对齐（0 未删 / 1 已删）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# EMQX REST API（控制下发走宿主机映射端口 18083；用 bootstrap API Key 认证）
emqx:
  api-url: http://localhost:18083/api/v5
  username: iotkey
  password: iotsecret123

# JWT（控制台登录签发 Token）
jwt:
  secret: iot-platform-mvp-jwt-secret-key-please-change-0123456789
  expire: 7200

logging:
  level:
    com.iot.platform: debug

# Actuator 配置：暴露健康检查和 Prometheus 端点
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always  # 总是显示详细健康信息（含各组件状态）
  health:
    db:
      enabled: true
    redis:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
