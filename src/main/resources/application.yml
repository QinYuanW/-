server:
  port: 8080

spring:
  application:
    name: iot-platform

  # 数据源：本地 MySQL 5.7（专用账号 iot）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/iot_platform?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: iot
    password: 123456

  # Redis：设备在线状态 / 鉴权凭据缓存
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，上线前移除
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 逻辑删除：与 schema.sql 的 deleted 字段对齐（0 未删 / 1 已删）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.iot.platform: debug
